services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $session: '@session'
            $redirectRouteName: 'account_change_password'
            $language: '%languages%'
            bool $baanNotificationEnabled: '%env(bool:BAAN_NOTIFICATION_ENABLED)%'

    AppBundle\EventListener\:
        resource: '../../src/AppBundle/EventListener/*'

    AppBundle\EventSubscriber\:
        resource: '../../src/AppBundle/EventSubscriber/*'

    ApiBundle\EventListener\:
       resource: '../../src/ApiBundle/EventListener/*'
