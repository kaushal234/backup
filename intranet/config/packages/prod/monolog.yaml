monolog:
    handlers:
        main:
            type: fingers_crossed
            action_level: error
            handler: nested
            excluded_http_codes: [404, 405]
            buffer_size: 50 # How many messages should be saved? Prevent memory leaks
        nested:
            type: rotating_file
            max_files: 10
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: error
        console:
            type:  console
        deprecation:
            type: rotating_file
            max_files: 30
            path: "%kernel.logs_dir%/%kernel.environment%.deprecations.log"
        deprecation_filter:
            type: filter
            handler: deprecation
            max_level: info
            channels: [ "php" ]
        main_elastic:
            type: fingers_crossed
            action_level: error
            handler: elastic
            excluded_http_codes: [ 404, 405 ]
            buffer_size: 50 # How many messages should be saved? Prevent memory leaks
        elastic:
            type: rotating_file
            max_files: 2
            path: "%kernel.logs_dir%/elastic.log"
            formatter: Monolog\Formatter\LogstashFormatter
            level: error
        elastic_baan_queries:
            type: rotating_file
            max_files: 2
            path: "%kernel.logs_dir%/elastic_baan_queries.log"
            formatter: Monolog\Formatter\LogstashFormatter
            level: info
            channels: [ "baan_database" ]
        easymile_toc_jira:
            type: rotating_file
            max_files: 2
            path: "%kernel.logs_dir%/easymile_toc_jira.log"
            formatter: Monolog\Formatter\LogstashFormatter
            level: info
            channels: ["easymile_toc_jira"]
