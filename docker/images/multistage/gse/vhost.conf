<VirtualHost *:80>
  DocumentRoot /var/www/alvest-web-portals/current/intranet

  XSendFile On
  XSendFilePath /var/www/alvest-web-portals/current/intranet/legacy

  Alias /admin /var/www/alvest-web-portals/current/admin
  Alias /survey-app /var/www/alvest-web-portals/current/survey/public
  Alias /intranet /var/www/alvest-web-portals/current/intranet/public
  Alias /shared /var/www/alvest-web-portals/current/shared/resources
  Alias /en/private /var/www/alvest-web-portals/current/intranet/public
  Alias /shopfloor /var/www/alvest-web-portals/current/shopfloor
  Alias /shop /var/www/alvest-web-portals/current/shopfloor/shop
  Alias /dms /var/www/alvest-web-portals/current/dms/web

  # Configure database for authentication
  DBDriver mysql
  DbDParams "host=mariadb user=root dbname=tld"

  RewriteEngine on
  RewriteCond %{HTTP:Authorization} ^(.+)$
  RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

  <Directory /var/www/shared/current>
    AllowOverride None
    Require all granted
  </Directory>

  <Directory /var/www/alvest-web-portals/current/intranet/public>
    AllowOverride None
    Require all granted

    # Disabling MultiViews prevents unwanted negotiation, e.g. "/app" should not resolve
    # to the front controller "/app.php" but be rewritten to "/app.php/app".
    <IfModule mod_negotiation.c>
      Options -MultiViews
    </IfModule>

    RewriteEngine On

    # Determine the RewriteBase automatically and set it as environment variable.
    RewriteCond %{REQUEST_URI}::$1 ^(/.+)/(.*)::\2$
    RewriteRule ^(.*) - [E=BASE:%1]

    # Sets the HTTP_AUTHORIZATION header removed by apache
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

    RewriteRule ^index\.php(/(.*)|$) %{ENV:BASE}/$2 [R=301,END]

    # If the requested filename exists, simply serve it.
    # We only want to let Apache serve files and not directories.
    RewriteCond %{REQUEST_FILENAME} -f
    RewriteRule .? - [END]

    # Rewrite all other queries to the front controller.
    RewriteRule .? %{ENV:BASE}/index.php [END]
  </Directory>

  <Directory /var/www/alvest-web-portals/current/survey/public>
    AllowOverride All
    RewriteEngine On

    # Determine the RewriteBase automatically and set it as environment variable.
    RewriteCond %{REQUEST_URI}::$1 ^(/.+)/(.*)::\2$
    RewriteRule ^(.*) - [E=BASE:%1]

    # If the requested filename exists, simply serve it.
    # We only want to let Apache serve files and not directories.
    RewriteCond %{REQUEST_FILENAME} -f
    RewriteRule .? - [END]

    # Rewrite all other queries to the front controller.
    RewriteRule .? %{ENV:BASE}/index.html [END]
  </Directory>

  # DIRECTORY ACL for ADMIN
  <Directory "/var/www/alvest-web-portals/current/admin">
    AllowOverride None
    AuthName "TLD Admin"
    AuthType Basic
    AuthBasicProvider dbd
    AuthDBDUserPWQuery "SELECT encrypt(password) as password FROM people WHERE email = %s"
    Require dbd-group superuser
    AuthzDBDQuery "SELECT group_name AS `group` FROM people_groups WHERE group_name='superuser' AND parent_id=(SELECT id FROM people WHERE email = %s) LIMIT 1"
  </Directory>

<Directory /var/www/alvest-web-portals/current/shopfloor/>
    AllowOverride None
    Require all granted
  </Directory>

  <Directory /var/www/alvest-web-portals/current/dms/web>
    AllowOverride None
    Require all granted
  </Directory>

  <Directory />
    Options FollowSymLinks
    AllowOverride None
  </Directory>

  RewriteEngine On

  DirectoryIndex index.php

  RewriteCond %{DOCUMENT_ROOT}/system/maintenance.html -f
  RewriteCond %{SCRIPT_FILENAME} !maintenance.html
  RewriteRule ^.*$ /system/maintenance.html [L,R=503]
</VirtualHost>
