services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            string $legacyUploadDir: '%legacy.upload_dir%'

    App\EventListener\:
        resource: '../../src/EventListener/'
        exclude: '../../src/EventListener/ErrorListener.php'

    App\Client\EventListener\:
        resource: '../../src/Client/EventListener/'
        exclude: '../../src/Client/EventListener/RequestListener.php'

    App\ION\EventListener\:
        resource: '../../src/ION/EventListener/'

    App\EventListener\UnallowedDeletionListener:
        arguments: [!tagged_iterator app.deletion_voter]

    App\EventListener\StrictSearchListener:
        arguments:
            $filterLocator: '@api_platform.filter_locator'
            $allowedRouteParams:
                - '%api_platform.collection.pagination.page_parameter_name%'
                - '%api_platform.collection.pagination.items_per_page_parameter_name%'
                - '%api_platform.collection.pagination.enabled_parameter_name%'
                - 'resource'
                - 'attributes'

    App\EventListener\JWTCreatedListener:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_created, method: onJWTCreated }

    App\EventListener\AclRemoverListener:
        tags:
            - { name: 'container.service_subscriber' }
