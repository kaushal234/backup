App\Entity\MIS\TroubleTicket\SupportLevel:
  support_level_1:
    id: 1
    level: 0
    name: 'Self-service'
    description: 'Users resolve issues themselves through FAQs, knowledge bases, service catalogs, how-to guides and AI chatbots (lost passwords, outdated profiles, basic application errors).'

  support_level_2:
    id: 2
    level: 1
    name: 'Basic help desk'
    description: 'Agents handle minor, low-severity issues: password resets, profile updates and basic software or hardware glitches such as reconnecting to the network or restarting a device.'

  support_level_3:
    id: 3
    level: 2
    name: 'Technical support'
    description: 'Agents dig into technical issues — system outages, update errors, hardware malfunctions and permissions flaws — using remote access tools and stricter documentation standards.'

  support_level_4:
    id: 4
    level: 3
    name: 'Expert support'
    description: 'Highest in-house tier handling severe or complex incidents: software/API integration, server maintenance and creating or updating standard operating procedures.'

  support_level_5:
    id: 5
    level: 4
    name: 'External support'
    description: 'Vendors and highly skilled outside experts handle vendor-specific or complex problems beyond the team scope, such as proprietary hardware repairs and product bugs.'
