App\Entity\Support\EquipmentFollowUpReport:
    # equipment_follow_up_reports/1
    fur_1:
        id: 1
        createdBy: '@extranet_user_for_fur'
        equipmentRecord: '@equipment_record_remi'
        comment: <text()>
        hourmeter: <numberBetween(10,5000)>
        hourmeterTotalizer: '@self->hourmeter'
        hourmeterDate: <(new \DateTime())>
        odometer: '5%? <numberBetween(10,5000)>'
        odometerDate: '5%? <(new \DateTime())>'
        operationalStatus: '@unit_op_status_<randomElement(["MCF", "MCP", "NMC"])>'
        accident: '@equipment_accident_1'
        maintenance: '@equipment_maintenance_1'

