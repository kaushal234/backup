    # /positions/18
    position_gtm:
        id: 18
        code: GTM
        description: 'GTM'
        level: '@level_EXECUTIVE'

    # /positions/19
    position_lgs:
        id: 19
        code: LGS
        description: 'LGS'
        level: '@level_EXECUTIVE'

    # /positions/20
    position_lgm:
