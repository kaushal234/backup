        description: 'LCM'
        level: '@level_EXECUTIVE'

    # /positions/22
    position_guest:
        id: 22
        code: !php/const App\Entity\Directory\Position::GUEST
        description: !php/const App\Entity\Directory\Position::GUEST
        level: '@level_EMPLOYEE'

  # /positions/24
