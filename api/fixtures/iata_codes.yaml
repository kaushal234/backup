App\Entity\Common\Airport:
    # airports/61
    airport_teumanto:
        id: 61
        type: Airport
        cityCode3: BDX
        cityName: Bordeaux
        code: BDX
        source: IATA

    # airports/62
    airport_tesurlesysteme:
        id: 62
        type: Airport
        cityCode3: PAR
        cityName: Paris
        code: CDG
        source: IATA
        country: '@country_1'

    # airports/63..109
    airport_{63..110}:
        id: <current()>
        type: Airport
        cityName: <city()>
        code: <regexify('[A-Z]{3}')>
        cityCode3 : '@self->code'
        source: <randomElement(['IATA', 'TLD'])>
        country: 85%? @country_4
        state: 20%? <regexify("[A-Z]{2}")>
        name: 20%? <company()>

    #airports/110
    airport_110:
        id: 110
        type: Airport
        cityName: Junon
        code: JMA
        cityCode3: JNN
        source: TLD
        country: '@country_7'
        state: 20%? <regexify("[A-Z]{2}")>
        name: Junon Military Airport

    # airports/111
    airport_favor:
        id: 111
        type: Airport
        cityCode3: PLO
        cityName: Perpète-les-oies
        code: PLO
        source: IATA
        country: '@country_2'

    # airports/112
    airport_quetevas:
        id: 112
        type: Airport
        cityCode3: MFL
        cityName: Muflin
        code: GRD
        source: IATA
        country: '@country_1'

