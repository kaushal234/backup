App\Entity\Quality\CalibratedTools\CalibrationLog:
  # /quality/calibrated_tools/calibration_logs/1
  log_first:
    id: 1
    tool: "@first_tool"
    startDate: <dateTimeBetween('-30 days', '+30 days')>
    endDate: <dateTimeBetween('+30 days', '+60 days')>
    calibrationDate: <(new DateTime("30 days ago"))>
    outOfToleranceForm: "@otf_first"
   # /quality/calibrated_tools/calibration_logs/2
  log_second:
    id: 2
    tool: "@second_tool"
    startDate: <dateTimeBetween('-30 days', '+30 days')>
    endDate: <dateTimeBetween('+30 days', '+60 days')>
    calibrationDate: <(new DateTime("30 days ago"))>
    outOfToleranceForm: "@otf_second"

   # /quality/calibrated_tools/calibration_logs/3..13
  log_{0..10}:
