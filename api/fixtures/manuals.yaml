App\Entity\Support\Manual:
  # /support/manuals/1
  manual_1:
    id: 1
    equipmentRecord: '@equipment_record_1'
    equipmentSerial: '@equipment_serial_1'
    description: "precise description of this manual"
    features: "full list of features of this manual"
    language: "en"
    status: <randomElement(['PRELIMINARY', 'RELEASED'])>
    createdAt: <dateTimeBetween('-2 months', 'now')>
    updatedAt: <dateTimeBetween('-2 days', 'now')>
    createdBy: '@user_basic'
    updatedBy: '@user_basic'
    documents:
      - '@manual_document_1'
      - '@manual_document_2'

