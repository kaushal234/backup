App\Entity\SPQ\QuotationLine:
    # /parts/quotation_lines/1..100
    quotation_line_{0..99}:
        id: <($current + 1)>
        position: <current()>
        status: <randomElement(['PENDING', 'QUOTED', 'CANCELLED', 'LOST'])>
        partNumber: <numberBetween(1102320,7400001)>
        displayedPartNumber: 15%? <numberBetween(800000,819000)>
        description: <sentence()>
        unitBasePrice: <randomFloat(2, 0.57)>
        totalPrice: <randomFloat(2, 0.57)>
        currency: <randomElement(['EUR', 'USD'])>
        quantity: <randomFloat(2, 0.57)>
        leadtime: <numberBetween(0,60)>
        createdAt: <dateTime()>
        quotedAt: <dateTimeInInterval(@self->createdAt, '+ 4 days')>
        quotation: '@quotation_<numberBetween(0,19)>'
        salesUnit: EA
        weight: <randomFloat(2, 0.57)>
        itemType: <randomElement(['Purchased', 'Manufactured', 'Cost'])>

