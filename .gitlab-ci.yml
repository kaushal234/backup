## EVENDORS

.evendors-defaults: &evendors-defaults
  stage: app-unit-tests
  rules:
    - !reference [.skip-for-scheduled-pipeline-composer-audit, rules ]
    - !reference [.skip-for-tags-rules, rules]
    - !reference [.api-default-rules, rules]
    - !reference [.evendors-default-rules, rules]
  image: $EVENDORS:$CI_COMMIT_SHA
  tags: [$DOCKER_TAG]
  before_script:
    - cd /srv/evendors
    - composer install --no-progress --prefer-dist --no-interaction --no-scripts
  services:
    - name: $DB:$CI_COMMIT_SHA
      alias: $DB
      command: ['mysqld', '--sql_mode=IGNORE_SPACE,NO_ENGINE_SUBSTITUTION','--innodb-flush-log-at-trx-commit=0']

.evendors-defaults-nodb: &evendors-defaults-nodb
  stage: code-inspection
  image: $EVENDORS:$CI_COMMIT_SHA
  rules:
    - !reference [.skip-for-tags-rules, rules]
    - !reference [.skip-for-scheduled-pipeline-composer-audit, rules]
    - !reference [.evendors-inspection-rules, rules]
  needs:
    - job: "docker-build-evendors"
  tags: [$DOCKER_TAG]
  before_script:
    - cd /srv/evendors
    - composer install --no-progress --prefer-dist --no-interaction --no-scripts

evendors-unit:
  <<: *evendors-defaults
  stage: app-unit-tests
  script:
    - vendor/bin/phpunit --group unit

evendors-functional:
  <<: *evendors-defaults
  stage: app-functional-tests
  needs:
    - job: "evendors-unit"
  script:
    - vendor/bin/phpunit --group functional

evendors-e2e:
  <<: *evendors-defaults
  stage: e2e-tests
  image:
    name: $EVENDORS:$CI_COMMIT_SHA
  variables:
    <<: *needs-api-variables
    INTERNAL_API_ENDPOINT: http://api
  services: *needs-api-services
  before_script:
    - *needs-api-before-script
    - echo "Waiting for API to be ready..."
  script: |
    cd evendors
    export PANTHER_NO_SANDBOX=1
    export PANTHER_APP_ENV=panther
    composer install --no-progress --prefer-dist --no-interaction --no-scripts
    bin/console importmap:install
    bin/console asset-map:compile
    vendor/bin/phpunit --group e2e || error=true
    mkdir -p $CI_PROJECT_DIR/evendors/var/cache/test
    cp var/cache/test/*.jpg $CI_PROJECT_DIR/evendors/var/cache/test/ || echo "No JPGs to copy"
    if [ $error ]; then
      exit 1;
    fi
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - evendors/var/cache/test/*.jpg

evendors-codingstyle:
  <<: *evendors-defaults-nodb
  script:
    - composer cs-check

evendors-lint:
  <<: *evendors-defaults-nodb
  script:
    - bin/console lint:twig templates --env=prod || error=true

evendors-phpstan:
  <<: *evendors-defaults-nodb
  script:
    - vendor/bin/phpstan analyse --no-progress --memory-limit=512M


