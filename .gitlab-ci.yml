    - yarn install --silent --frozen-lockfile --no-cache
    - yarn lint

mobile-version-check:
  <<: *mobile-defaults
  # override rules because we need .mobile-default-rules WITHOUT the .gitlab-ci.yml change trigger
  rules:
    - !reference [ .skip-for-scheduled-pipeline-composer-audit, rules ]
    - !reference [ .skip-for-tags-rules, rules ]
    - changes:
        - mobile/**/*
        - docker/images/multistage/mobile/**/*
  script:
    - |
      cd "$CI_PROJECT_DIR"
      FILE="mobile/src/constants/version.tsx"
      git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      CURRENT_VERSION=$(grep -oP 'SW_VERSION\s*=\s*\K\d+' "$FILE" || echo "")
      BASE_VERSION=$(git show origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:"$FILE" 2>/dev/null | grep -oP 'SW_VERSION\s*=\s*\K\d+' || echo "")
      echo "Current branch version: $CURRENT_VERSION"
      echo "Target branch ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME) version: $BASE_VERSION"
      if [[ -z "$CURRENT_VERSION" || -z "$BASE_VERSION" ]]; then
        echo "App Version not found in one of the branches. Skipping version check."
        exit 0
      fi
      if [[ "$CURRENT_VERSION" -le "$BASE_VERSION" ]]; then
        echo "App Version was not incremented!"
        exit 1
      else
        echo "App Version incremented."
      fi

.cypress-defaults: &cypress-defaults
  stage: e2e-tests
  rules:
    - !reference [.skip-for-scheduled-pipeline-composer-audit, rules]
    - !reference [.skip-for-tags-rules, rules]
    - !reference [.api-default-rules, rules]
    - !reference [.mobile-default-rules, rules]
  tags: [docker]
  variables:
    <<: *needs-api-variables
    REACT_APP_API_BASE_URL: http://api
    CYPRESS_API_BASE_URL: http://api

mobile-e2e:
  <<: *cypress-defaults
  tags: [$CYPRESS_TAG]
  image:
    name: cypress/included:latest
    entrypoint: [""]
  services:
    - *needs-api-services
  before_script:
    - apt-get -y update; apt-get -y install curl
    - cd mobile
  script:
    - yarn install --frozen-lockfile
    - yarn start &
    - timeout 300 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' http://api)" != "401" ]]; do sleep 3; done' || false
    - npx wait-on http://localhost:3000
    - yarn cypress:parallel
  artifacts:
    when: on_failure
    paths:
      - mobile/cypress/screenshots/**/*.png
    expire_in: 1 day

## TWIG-HELPER
twig-helper-codingstyle:
  <<: *intranet-defaults-noapi
  rules:
    - !reference [ .skip-for-scheduled-pipeline-composer-audit, rules ]
    - !reference [ .skip-for-tags-rules, rules ]
    - !reference [ .packages-default-rules, rules ]
  script:
    - cd /srv/alvest-web-portals/packages/twig_helper
    - /srv/alvest-web-portals/intranet/vendor/bin/php-cs-fixer fix --dry-run --using-cache=no --no-interaction -v --diff

twig-helper-phpstan:
  <<: *intranet-defaults-noapi
  rules:
    - !reference [ .skip-for-scheduled-pipeline-composer-audit, rules ]
    - !reference [ .skip-for-tags-rules, rules ]
    - !reference [ .packages-default-rules, rules ]
  script:
    - cd /srv/alvest-web-portals/packages/twig_helper
    - composer install --no-progress --prefer-dist --no-interaction --no-scripts 
    - vendor/bin/phpstan analyse --no-progress --memory-limit=512M

twig-helper-unit:
  stage: app-unit-tests
  image: ${PROJECT_IMAGE}
  tags: [$DOCKER_TAG]
  rules:
    - !reference [ .skip-for-scheduled-pipeline-composer-audit, rules ]
    - !reference [ .skip-for-tags-rules, rules ]
    - !reference [ .packages-default-rules, rules ]
  needs:
    - job: "docker-build-evendors"
    - job: "twig-helper-phpstan"
    - job: "twig-helper-codingstyle"
  parallel:
    matrix:
      - PROJECT_IMAGE: "$GSE:$CI_COMMIT_SHA"
        PACKAGE_DIR: packages/twig_helper
        COMPOSER: composer-gse.json
      - PROJECT_IMAGE: "$EVENDORS:$CI_COMMIT_SHA"
        PACKAGE_DIR: /srv/packages/twig_helper
        COMPOSER: composer-evendors.json
  before_script:
    - cd $PACKAGE_DIR
  script:
    - composer install --no-progress --prefer-dist --no-interaction --no-scripts 
    - vendor/bin/phpunit

twig-helper-unit-api:
  stage: api-unit-tests
  image: $API_TWIG_HELPER_TEST:$CI_COMMIT_SHA
  tags: [$DOCKER_TAG]
  rules:
    - !reference [ .skip-for-scheduled-pipeline-composer-audit, rules ]
    - !reference [ .skip-for-tags-rules, rules ]
    - !reference [ .packages-default-rules, rules ]
  needs:
    - job: "docker-build-api-twig-helper-test"
  before_script:
    - cd /srv
  script:
    - COMPOSER=composer-api.json composer install --no-progress --prefer-dist --no-interaction --no-scripts 
    - vendor/bin/phpunit

