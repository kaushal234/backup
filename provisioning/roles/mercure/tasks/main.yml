- name: Ensure Mercure directory exists
  ansible.builtin.file:
    path: /opt/mercure
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Mercure compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/mercure/compose.yml
    owner: root
    group: root
    mode: "0644"

- name: Deploy Mercure Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/mercure/Caddyfile
    owner: root
    group: root
    mode: "0644"
  notify: Restart Mercure

- name: Deploy Mercure env file
  ansible.builtin.template:
    src: mercure.env.j2
    dest: /opt/mercure/.env
    owner: root
    group: root
    mode: "0600"
  notify: Restart Mercure

- name: Start Mercure stack
  community.docker.docker_compose_v2:
    project_src: /opt/mercure
    state: present
