  ansible.posix.mount:
    src: "{{ nfs_server_ip }}:/data0/SupplierPaymentAdvice"
    path: /mnt/grpfps10.SupplierPaymentAdvice
    opts: defaults
    state: absent
    fstype: nfs
  when: (inventory_hostname in groups['api']) and
    ((inventory_file | basename) == "production.yml")

- name: Mount nfs shared volume of file uploads from file server grpfps10
  become: true
  ansible.posix.mount:
    src: "{{ nfs_server_ip }}:/data"
    path: /data
    opts: defaults
    state: mounted
    fstype: nfs
  when: (inventory_hostname in groups['portals']) and
    ((inventory_file | basename) == "production.yml")

- name: Create symlink for uploads dir on api
  become: true
  ansible.builtin.file:
    src: "/mnt/webprod.uploads"
    dest: "{{ monorepo_path }}/shared/api/uploads"
    owner: deployer
    group: php_executor
    state: link
  when: (inventory_hostname in groups['api']) and
    ((inventory_file | basename) == "production.yml")

- name: Create symlink for uploads dir on portals
  become: true
  ansible.builtin.file:
    src: "/data/uploads"
    dest: "{{ monorepo_path }}/shared/intranet/legacy/uploads"
    owner: deployer
    group: php_executor
    state: link
  when: (inventory_hostname in groups['portals']) and ((inventory_file | basename) == "production.yml")
