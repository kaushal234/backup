- name: Ensure nfs is installed
  become: true
  ansible.builtin.apt:
    name: nfs-common
    state: present

# doc for permissions given by infra team :
# https://alvestgroup.atlassian.net/wiki/spaces/DEV/pages/2125987842/NFS+mount+on+prod+and+staging+servers

- name: Mount nfs shared volume parts_pics from grpfps10
  become: true
  ansible.posix.mount:
    src: "{{ nfs_server_ip }}:/data0/parts_pics"
    path: /mnt/grpfps10.parts_pics/
    opts: defaults
    state: mounted
    fstype: nfs

- name: Mount nfs shared volume windsor.released from grpfps10
  become: true
  ansible.posix.mount:
    src: "{{ nfs_server_ip }}:/data0/windsor.released"
    path: /mnt/windsor.released/
    opts: defaults
    state: mounted
    fstype: nfs

- name: Mount nfs shared volume global.released from grpfps10
  become: true
  ansible.posix.mount:
    src: "{{ nfs_server_ip }}:/data0/global.released"
    path: /mnt/global.released/
    opts: defaults
    state: mounted
    fstype: nfs

- name: Mount nfs shared volume manuals_diagram from grpfps10
  become: true
  ansible.posix.mount:
    src: "{{ nfs_server_ip }}:/data1/manuals_diagrams"
    path: /mnt/grpfps10.manuals_diagrams/
    opts: defaults
    state: mounted
    fstype: nfs
  when: (inventory_hostname in groups['api']) or
    ((inventory_file | basename) == "production.yml")

- name: Mount nfs shared volume quality from grpfps10
  become: true
  ansible.posix.mount:
    src: "{{ nfs_server_ip }}:/data2"
    path: /mnt/grpfps10.data2/
    opts: defaults
    state: mounted
    fstype: nfs
  when: (inventory_hostname in groups['portals']) and
    ((inventory_file | basename) == "production.yml")

- name: Create local volume manuals_diagram to fake nfs
  become: true
  ansible.builtin.file:
    path: /mnt/grpfps10.manuals_diagrams
    state: directory
    owner: deployer
    group: php_executor
    mode: '0755'
  when: (inventory_hostname in groups['portals']) and
    ((inventory_file | basename) == "staging.yml")

- name: Mount nfs shared volume dms from grpfps10
  become: true
  ansible.posix.mount:
    src: "{{ nfs_server_ip }}:/data0/dms"
    path: /mnt/grpfps10.dms/
    opts: defaults
    state: mounted
    fstype: nfs
  when: (inventory_hostname in groups['api']) or
    ((inventory_file | basename) == "production.yml")

- name: Create local volume dms to fake nfs
  become: true
  ansible.builtin.file:
    path: /mnt/grpfps10.dms
    state: directory
    owner: deployer
    group: php_executor
    mode: '0755'
  when: (inventory_hostname in groups['portals']) and
    ((inventory_file | basename) == "staging.yml")

