- name: Ensure Ollama directory exists
  ansible.builtin.file:
    path: /opt/ollama
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Ollama entrypoint script
  ansible.builtin.template:
    src: entrypoint.sh.j2
    dest: /opt/ollama/entrypoint.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart Ollama

- name: Deploy Ollama compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/ollama/compose.yml
    owner: root
    group: root
    mode: "0644"
  notify: Restart Ollama

- name: Start Ollama stack
  community.docker.docker_compose_v2:
    project_src: /opt/ollama
    state: present
