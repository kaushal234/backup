# geerlingguy.nodejs
nodejs_version: "22.x"
nodejs_npm_global_packages:
  - name: yarn
    version: 1.22.22

# geerlingguy.php-versions
php_version: '8.3'

# geerlingguy.php-mysql
php_mysql_package: php8.3-mysql

# geerlingguy.php
php_webserver_daemon: apache2
php_default_version_debian: "8.3"
php_date_timezone: "America/New_York"
php_enable_php_fpm: true
php_fpm_pool_user: deployer
php_fpm_pool_group: php_executor
php_session_gc_maxlifetime: "{{ inactivity_limit }}"
php_fpm_pools:
  - pool_name: www
    pool_template: templates/portals/www.conf.j2
    pool_listen: "127.0.0.1:9000"
    pool_listen_allowed_clients: "127.0.0.1"
    pool_pm_max_children: 50
    pool_pm_start_servers: 8
    pool_pm_min_spare_servers: 8
    pool_pm_max_spare_servers: 16
    pool_pm_max_requests: 500
php_enable_apc: true
php_memory_limit: "2048M"
php_upload_max_filesize: "32M"
php_post_max_size: "64M"
php_max_input_vars: "5000"
php_packages:
  - php{{ php_default_version_debian }}-apcu
  - php{{ php_default_version_debian }}-cli
  - php{{ php_default_version_debian }}-common
  - php{{ php_default_version_debian }}-curl
  - php{{ php_default_version_debian }}-fpm
  - php{{ php_default_version_debian }}-gd
  - php{{ php_default_version_debian }}-intl
  - php{{ php_default_version_debian }}-mbstring
  - php{{ php_default_version_debian }}-mcrypt
  - php{{ php_default_version_debian }}-redis
  - php{{ php_default_version_debian }}-soap
  - php{{ php_default_version_debian }}-sybase #provides pdo-dblib for baan connection
  - php{{ php_default_version_debian }}-xml
  - php{{ php_default_version_debian }}-zip
  - libapache2-mod-xsendfile
php_session_save_handler: redis
php_session_save_path: '"tcp://{{ haproxy_ip }}:6379?auth={{ redis_password_url_encoded }}"'

# geerlingguy.apache
apache_remove_default_vhost: true
apache_vhosts:
  - servername: "_default_"
    documentroot: "/var/www/html"
    extra_parameters: |
      CustomLog ${APACHE_LOG_DIR}/default-deny.access.log combined
      ErrorLog ${APACHE_LOG_DIR}/default-deny.error.log
      <Location />
        Require all denied
      </Location>
      ErrorDocument 403 "Access denied."
  - servername: "{{ dms_host }}"
    documentroot: "{{ monorepo_path }}/current/dms/web"
    extra_parameters: |
      Alias /shared "{{ monorepo_path }}/current/shared/resources"
      CustomLog ${APACHE_LOG_DIR}/{{ dms_host }}.access.log combined
      ErrorLog ${APACHE_LOG_DIR}/{{ dms_host }}.error.log
      ProxyPassMatch ^/(.*\.php(/.*)?)$ "fcgi://127.0.0.1:9000{{ monorepo_path }}/current/dms/web"
  - servername: "{{ shopfloor_host }}"
    documentroot: "{{ monorepo_path }}/current/shopfloor"
    extra_parameters: |
      Alias /shared "{{ monorepo_path }}/current/shared/resources"
      CustomLog ${APACHE_LOG_DIR}/{{ shopfloor_host }}.access.log combined
      ErrorLog ${APACHE_LOG_DIR}/{{ shopfloor_host }}.error.log
      ProxyPassMatch ^/(.*\.php(/.*)?)$ "fcgi://127.0.0.1:9000{{ monorepo_path }}/current/shopfloor"
  - servername: "tld-gse.com"
    extra_parameters: |
      ServerAlias tldgse.com
      ServerAlias www.tldgse.com
      RedirectPermanent / "https://{{ tld_host }}/"
  - servername: "{{ tld_host }}"
    extra_parameters: |
      DocumentRoot /var/www/alvest-web-portals/current/intranet/public
      DirectoryIndex index.php

      XSendFile On
      XSendFilePath /var/www/alvest-web-portals/current/intranet/legacy
      XSendFilePath /data/uploads

      RedirectMatch 301 ^/evendors/(.*)$ "https://evendors.tld-gse.com"
      Alias /shared      {{ monorepo_path }}/current/shared/resources
      Alias /en/private  {{ monorepo_path }}/current/intranet/public
      
      CustomLog ${APACHE_LOG_DIR}/{{ tld_host }}.access.log combined
      ErrorLog ${APACHE_LOG_DIR}/{{ tld_host }}.error.log
      
      RewriteEngine on
      RewriteCond %{HTTP:Authorization} ^(.+)$
      RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
      
      RewriteRule ^/?$ https://{{ tld_group_host }} [L,R]
      
      <Directory {{ monorepo_path }}/current/intranet/public>
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        <IfModule mod_negotiation.c>
            Options -MultiViews
        </IfModule>
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_URI}::$0 ^(/.+)/(.*)::\2$
            RewriteRule .* - [E=BASE:%1]
            RewriteCond %{HTTP:Authorization} .+
            RewriteRule ^ - [E=HTTP_AUTHORIZATION:%0]
            RewriteCond %{ENV:REDIRECT_STATUS} =""
            RewriteRule ^index\.php(?:/(.*)|$) %{ENV:BASE}/$1 [R=301,L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^ %{ENV:BASE}/index.php [L]
        </IfModule>
        <IfModule !mod_rewrite.c>
            <IfModule mod_alias.c>
                RedirectMatch 307 ^/$ /index.php/
            </IfModule>
        </IfModule>
      </Directory>
        <FilesMatch \.php$>
          SetHandler "proxy:fcgi://127.0.0.1:9000/"
        </FilesMatch>
  - servername: "monitoring"
    extra_parameters: |
      ServerAlias 127.0.0.1
      SetEnvIf Request_URI "^/server-status$" dontlog
      SetEnvIf Request_URI "^/fpm-status$" dontlog

      CustomLog ${APACHE_LOG_DIR}/status.access.log combined env=!dontlog
      ErrorLog  ${APACHE_LOG_DIR}/status.error.log

      <Location "/server-status">
        SetHandler server-status
        Require ip 127.0.0.1
      </Location>

      <Location "/fpm-status">
        Require ip 127.0.0.1
        SetHandler "proxy:fcgi://127.0.0.1:9000"
        ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "/fpm-status"
      </Location>
apache_mods_enabled:
  - rewrite
  - xsendfile

