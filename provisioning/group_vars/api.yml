# geerlingguy.nodejs
nodejs_version: "22.x"
nodejs_npm_global_packages:
  - name: yarn
    version: 1.22.22

# geerlingguy.php-versions
php_version: '8.4'

# geerlingguy.php-mysql
php_mysql_package: php8.4-mysql

# geerlingguy.php
php_webserver_daemon: "nginx"
php_default_version_debian: "8.4"
php_date_timezone: "America/New_York"
php_enable_php_fpm: true
php_fpm_pool_user: deployer
php_fpm_pool_group: php_executor
php_fpm_pools:
  - pool_name: api
    pool_template: templates/api/www.conf.j2
    pool_listen: "127.0.0.1:9000"
    pool_listen_allowed_clients: "127.0.0.1"
    pool_pm_max_children: 80
    pool_pm_start_servers: 10
    pool_pm_min_spare_servers: 8
    pool_pm_max_spare_servers: 16
    pool_pm_max_requests: 700
php_enable_apc: true
php_memory_limit: "-1"
php_upload_max_filesize: "32M"
php_apc_shm_size: "256M"
php_fpm_ini_options:
php_packages:
  - php{{ php_default_version_debian }}-apcu
  - php{{ php_default_version_debian }}-cli
  - php{{ php_default_version_debian }}-common
  - php{{ php_default_version_debian }}-curl
  - php{{ php_default_version_debian }}-fpm
  - php{{ php_default_version_debian }}-gd
  - php{{ php_default_version_debian }}-imagick
  - php{{ php_default_version_debian }}-intl
  - php{{ php_default_version_debian }}-mcrypt
  - php{{ php_default_version_debian }}-mbstring
  - php{{ php_default_version_debian }}-soap
  - php{{ php_default_version_debian }}-xml
  - php{{ php_default_version_debian }}-zip
  - php{{ php_default_version_debian }}-sysvsem
  - php{{ php_default_version_debian }}-calendar

# geerlingguy.nginx
nginx_remove_default_vhost: true
nginx_listen_ipv6: false
nginx_server_tokens: "off"
nginx_vhosts:
  - listen: "80"
    server_name: "{{ alvest_api_url }}"
    root: "{{ monorepo_path }}/current/api/public"
    index: "index.php index.html index.htm"
    access_log: "/var/log/nginx/{{ alvest_api_url }}.access.log"
    error_log: "/var/log/nginx/{{ alvest_api_url }}.error.log"
    state: "present"
    filename: "{{ alvest_api_url }}.conf"
    extra_parameters: |
      location / {
          allow {{ haproxy_dmz_subnet }};
          deny all;
          try_files $uri /index.php$is_args$args;
      }
    
      location ~ ^/index\.php(/|$) {
          allow {{ haproxy_dmz_subnet }};
          deny all;
          fastcgi_pass 127.0.0.1:9000;
          fastcgi_split_path_info ^(.+\.php)(/.*)$;
          fastcgi_read_timeout 180;
          include fastcgi_params;
          fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
          fastcgi_param DOCUMENT_ROOT $realpath_root;
          internal;
      }
    
      location ~ \.php$ {
          return 404;
      }
            
      location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow {{ prtg_ip }};
        deny all;
      }
      
      location /fpm-status {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /fpm-status;
        allow 127.0.0.1;
        deny all;
        access_log off;
      }
      
      location ^~ /.well-known/mercure {
        allow {{ haproxy_dmz_subnet }};
        allow 127.0.0.1;
        deny all;
        proxy_pass http://{{ mercure_internal_host }}:{{ mercure_internal_port }};
        proxy_read_timeout 24h;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /maildev/ {
        proxy_pass http://localhost:1080/;
        proxy_http_version 1.1;
        proxy_redirect off;
        
        # Needed if MailDev is not on `/`
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter 'href="/'  'href="/maildev/';
        sub_filter 'src="/'   'src="/maildev/';
        proxy_set_header Accept-Encoding "";
        
        # Strip /maildev prefix for MailDev
        rewrite ^/maildev/(.*)$ /$1 break;
        
        # Keep these headers for logging / auth
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        
        # Secure it
        auth_basic "Restricted MailDev Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
      }

# supervisor
supervisor_programs:
  - name: 'messenger-consume'
    command: php current/api/bin/console messenger:consume async --time-limit=3600 --memory-limit=128M --limit=100
    state: present
    configuration: |
      directory={{ monorepo_path }}/
      autostart=true
      autorestart=true
      numprocs=2
      user=deployer
      process_name=%(program_name)s_%(process_num)02d
      stdout_logfile=/var/log/supervisor/messenger-consume.log
      stderr_logfile=/var/log/supervisor/messenger-consume-error.log
  - name: 'maildev'
    command: /usr/bin/maildev --smtp=1025 --web=1080
    state: '{{ "present" if (inventory_file | basename) == "staging.yml" else "absent" }}'
    configuration: |
      directory=/tmp
      autostart=true
      autorestart=true
      user=deployer
      redirect_stderr=true
      stdout_logfile=/var/log/maildev.log
      environment=NODE_ENV="production"

