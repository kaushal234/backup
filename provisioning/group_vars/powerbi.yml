# geerlingguy.nodejs
nodejs_version: "24.x"

# geerlingguy.nginx
nginx_remove_default_vhost: true
nginx_listen_ipv6: false
nginx_server_tokens: "off"
nginx_vhosts:
  - listen: "80"
    server_name: "{{ powerbi_url }}"
    root: "{{ monorepo_path }}/current/powerbi/src/server.js"
    access_log: "/var/log/nginx/{{ powerbi_url }}.access.log"
    error_log: "/var/log/nginx/{{ powerbi_url }}.error.log"
    state: "present"
    filename: "{{ powerbi_url }}.conf"
    extra_parameters: |
      server_tokens off;    

      location / {
        allow {{ haproxy_dmz_subnet }};
        deny all;
        proxy_pass http://127.0.0.1:9500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    
      location ~ \.php$ {
        return 404;
      }
      
      location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow {{ prtg_ip }};
        deny all;
      }

