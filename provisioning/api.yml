- name: Playbook for api servers
  hosts: api
  roles:
    - { role: shared-handlers, tags: [always] }
    - { role: monitored-server, tags: [monitoring] }
    - { role: iptables, tags: [security], vars: { iptables_rules_template: templates/api/iptables/rules.v4.j2 }}
    - { role: utils, tags: [utils] }
    - { role: code-host, tags: [web] }
    - { role: cron, tags: [cron] }
    - { role: crontab-api, tags: [cron] }
    - { role: git, tags: [web] }
    - { role: redis-master, tags: [redis] }
    - { role: geerlingguy.nodejs, become: true, tags: [web, js], vars: { ansible_distribution_release: impish }} # noqa var-naming[no-role-prefix]
    - { role: pdf, tags: [pdf] }
    - { role: geerlingguy.nginx, become: true, tags: [web, nginx] }
    - { role: geerlingguy.php-versions, become: true, tags: [web, php, env] }
    - { role: geerlingguy.php-mysql, become: true, tags: [web, php, env] }
    - { role: geerlingguy.php, become: true, tags: [web, php, env] }
    - { role: logrotate, become: true, tags: [php] }
    - { role: supervisor, become: true, tags: [supervisor] }
    - { role: geerlingguy.ntp, become: true, tags: [utils] }
    - { role: mail, become: true, tags: [mail] }
    - { role: mailcatcher, become: true, tags: [mail] }
    -
      role: dotenv
      tags: [env]
      vars:
        dotenv_template: "templates/api/.env.j2"
        dotenv_path: "{{ monorepo_path }}/shared/api/.env"
        dotenv_profile_filename: env
    - { role: jwt, tags: [jwt], vars: { jwt_directory: "{{ monorepo_path }}/shared/api/config/jwt" } }
    - { role: mount, tags: [mount] }
    - { role: sentinel, tags: [sentinel] }
    - { role: auditbeat, tags: [auditbeat] }
    - { role: landscape, tags: [landscape] }
    - { role: docker, become: true, tags: [docker] }
    - { role: mercure, become: true, tags: [mercure] }
    - { role: ollama, become: true, tags: [ollama] }
