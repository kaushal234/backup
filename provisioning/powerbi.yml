- name: Playbook for powerbi servers
  hosts: powerbi
  roles:
    - { role: shared-handlers, tags: [always] }
    - { role: monitored-server, tags: [monitoring] }
    - { role: iptables, tags: [security], vars: { iptables_rules_template: templates/powerbi/iptables/rules.v4.j2 }}
    - { role: utils, tags: [utils] }
    - { role: geerlingguy.ntp, become: true, tags: [utils] }
    - { role: code-host, tags: [web] }
    - { role: geerlingguy.nodejs, become: true, tags: [web, js]}
    - { role: git, tags: [web] }
    - { role: geerlingguy.nginx, become: true, tags: [web, nginx] }
    - { role: pm2, tags: [web, js] }
    - { role: logrotate, become: true, tags: [php] }
    -
      role: dotenv
      tags: [env]
      vars:
        dotenv_template: "templates/powerbi/.env.j2"
        dotenv_path: "{{ monorepo_path }}/shared/powerbi/.env"
        dotenv_profile_filename: powerbi_env
    - { role: sentinel, tags: [sentinel] }
    - { role: auditbeat, tags: [auditbeat] }
    - { role: landscape, tags: [landscape] }
