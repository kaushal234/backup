    green_tag_report:
        value: Number of first GT
        by_month: By Month
        factory: Factory
        total: Total
        in_range: In range
        percentage: "%"
        interval: Interval
        selected_month: Selected Month
        last_6_months: Last 6 months
        title: GT linearity in %factory% for %period%
        helper: |
         How to read this chart
            Daily Value : number of units which passed Green Tag or voluntary Yellow Tag that day.
            Linearity baseline for the KPI: the 1st day of the month, the system will count the No. of ER’s (excluding ER lite and PAS) with estimated GT in the month or voluntary 1st YT date (stock units) scheduled in the month, divided by the number of working days in the month (excluding days off).
            Min-Max range around the linearity baseline defined as follows:
            • If the baseline is less than 3 units per day, the range goes from baseline to baseline + 1.
            • If the baseline is between 3 and 5 units per day, the range goes from baseline to baseline + 2.
            • If the baseline is 5 or more units per day, the range goes from baseline - 1 to baseline + 2.
            
            KPI: no. of days within the Min-Max range in the period divided by no. of working days for same period
    
            This helps you see if daily production is within the expected range for the month.
    
