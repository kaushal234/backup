  task:
    phase_0:
      short_description: Gate_0 task (as per current wording)
      description: "Gate-0 Task-DMS 6222

      Dear MOO
      
      The MIS Project %project_id%, %project_name% was just set to Phase 0, and you are the concerned Business Operational Owner.
      
      As per DMS 6222, this phase will consist in preparing the Gate-0 and defining:
        - Project goal, scope and content
        - Project team
        - Project Timeline
        - Budget, expected savings and benefits
        - Information security analysis and risk treatment plan
        
      Please refer to DMS6222 to know the Gate-0 process
      Please organize the meeting in coordination with the MSPO, before Project Status is changed to Phase 1 and development engaged
        
      Please also ensure that the risk analysis is :
        - Uploaded in this task for IF10000 & IF1000 (using https://dms.tld-group.com/index.php?m[0]=view&id=6731)
        - Uploaded or documented in this task for IF100 & IF10 
        
      In both cases typical risks are documented in: https://dms.tld-group.com/index.php?m[0]=view&id=7547

      Thanks"
    phase_1:
      short_description: Phase 1 Task
      description: "MIS Project %project_id%, %project_name%

      Please conduct Phase 1 works as per DMS6222 :
        - Dev project : Technical specification definition, coding/settings, partial release and tests with MOO/GKU.
        - Infra project : High Level Design, deployment specification and guidelines definition"
    phase_2:
      short_description: Phase 2 Task
      description: "MIS Project %project_id%, %project_name%

      Please conduct works as per DMS6222 :
        - Dev project : Test of the final release before Go-Live. Record tests results in the task
        - Infra project : Beta deployment or POC. Record results in the task
        - Information Security : secure risk analysis treatment plan is under control prior to go-live
        - Training of users"
    phase_3:
      short_description: Phase 3 Task
      description: "MIS Project %project_id%, %project_name%

      Please conduct works as per DMS6222 :
        - Dev project : Go-Live and ramp up monitoring (Hypercare). Record main elements in the task
        - Infra project : Solution roll out. Record main elements in the task."
    phase_4:
      short_description: Phase 4 Task
      description: "MIS Project %project_id%, %project_name%

      Please conduct works as per DMS6222 :
        - Technical Documentation Finalization
        - User Documentation Finalization and communication
        - Information Security : secure risk analysis treatment plan is completed.
        - Run Mode processes definition and documentation (Monitoring means, KPI, …)"
    privacy_design:
      short_description: Privacy per design task
      description: "MIS Project %project_id%, %project_name%
  
      This task is opened for Project Manager and DPO to check Privacy by Design involved in the current project.
      Please refer to DMS7809 and fill in the form and attached it to this task before completion.
      
      Closing this task means Privacy by designed has been considered and there is no concern about personal data.
      If any current or new process has an impact on the Processing REGISTER of the company, this one must be updated accordingly.
      
      Thanks"
