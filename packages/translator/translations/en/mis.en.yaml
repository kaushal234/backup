          button: Yes, confirmed
          message: |
            By clicking <strong>confirm</strong> you certify that the user <strong>userLastname userFirstname</strong> access to the application <strong>moduleName</strong> is actually granted.
      grant_denied:
        button: Denied
        target:
          button: Yes, denied
          message: |
            By clicking <strong>deny</strong> you certify that you refuse to create an account for <strong>userLastname userFirstname</strong> to the application <strong>moduleName</strong>.<br /> The system will then update the rules setup for this user accordingly.
      remove_confirmed:
        button: Confirmed
        target:
          button: Yes, confirmed
          message: |
            By clicking <strong>confirm</strong> you certify that the user <strong>userLastname userFirstname</strong> access to the application <strong>moduleName</strong> is actually disabled.
      remove_denied:
        button: Denied
        target:
          button: Yes, denied
          message: |
            By clicking <strong>deny</strong> you certify that the user <strong>userLastname userFirstname</strong> access to the application <strong>moduleName</strong> is actually maintened.<br /> The system will then update the rules setup for this user accordingly.

