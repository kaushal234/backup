    kpi:
        titles:
            qir: Quote Immediate fill Rate
            atq: Average Time to Quote
            cat: Customer Answer Time
            scr: Sales Conversion Rate
            wr: Win Rate
            quotationsNumber: Quotations Number
            quotationLinesNumber: Quotation Lines Number
        definitions:
            qir: |
                Percentage of quotations submitted in less than 24 hours from the creation date.

                Number of quotation where the difference between submission and creation is less than 24 hours in a month divided by the number of quotations submitted in this month.
            atq: |
                Average number of days between quotation's reception and submission.

                Sum of the differences between reception and submission dates in a month divided by the number of quotations submitted in this month.
            cat: |
                Average number of days between quotation's submission and closing.

                Sum of the differences between submission and closing dates in a month divided by the number of quotations closed in this month.
            scr: |
                SRCV
                ====
                Percentage of quotations' lines value sold.

                Sum all SOLD quotations' lines amount converted in USD in a month devided by the sum of quotations' lines amount created in this month.

                SRCL
                ====
                Percentage of quotations' lines sold.

                Number of SOLD quotations' lines in a month devided by the number of quotations' lines created in this month.
            wr: |
                WRV
                =====
                Percentage of quotations' lines value sold.

                Sum all SOLD quotations' lines amount converted in USD in a month devided by the sum of quotations' lines amount closed in this month.

                WRL
                =====
                Percentage of quotations' lines sold.

                Number of SOLD quotations' lines in a month devided by the number of quotations' lines closed in this month.
            quotationsNumber: |
                Number of quotations received per month.
            quotationLinesNumber: |
                Number of quotations' lines received per month.
