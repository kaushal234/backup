criterias:
  title: Criteria
  4: Communication, transparency<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;and responsiveness
  7: Environmental, Social,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Governance

headers:
  criteria_1: Cost
  criteria_2: QA
  criteria_3: Lg
  criteria_4: CR&T
  criteria_5: I&P
  criteria_6: Pd&S
  criteria_7: ESG
  criteria_8: A-C
  criteria_9: Cs
  criteria_8_full: Anti Corruption
  criteria_9_full: Cybersecurity
  criteria_1_1: Costs much higher than the market without justification. Little or no transparency. No flexibility. Replaceable supplier
  criteria_1_2: Costs above market average. Limited transparency. Low flexibility. Replaceable but costly supplier
  criteria_1_3: High costs justified by the absence of alternatives in the market. Unique or rare supplier, indispensable despite high cost. Clear pricing but limited flexibility
  criteria_1_4: Competitive and transparent costs. Negotiations possible. Reliable supplier meeting most needs.
  criteria_1_5: Very competitive costs with high transparency and flexibility. Attractive offers. Competitive supplier with available alternatives
  criteria_2_1: Frequent non-conformities. High defect rate. Lack of quality control. Major issues affecting internal processes
  criteria_2_2: Recurring quality issues. Requires constant monitoring. Little to no improvement despite feedback
  criteria_2_3: Generally acceptable quality with occasional deviations. Specifications mostly met. Some improvement efforts visible
  criteria_2_4: Good product quality with low defect rates. Responsive to quality concerns. Quality system is implemented
  criteria_2_5: Consistently high-quality products. Nearly zero defects. Strong and proven commitment to continuous improvement. Robust quality control in place.
  criteria_3_1: Deliveries very often late or incomplete. Delivery documents frequently missing or incorrect. No reliability. No traceability. Unresolved logistics issues
  criteria_3_2: Irregular deliveries. Frequent errors (quantity, packaging). Delivery documents often incomplete or incorrect. Lack of visibility on flows. Low responsiveness to issues
  criteria_3_3: Generally acceptable logistics with some deviations. Deadlines mostly met. Delivery documents compliant but sometimes incomplete. Acceptable responsiveness. Partial tracking available
  criteria_3_4: Reliable and punctual deliveries. Delivery documents always correct and available. Well-controlled logistics process. Tracking and traceability available. Good ability to manage unexpected events
  criteria_3_5: Smooth, well-managed, and proactive logistics. Deliveries always on time and compliant. Complete, accurate, and always available delivery documents. Excellent traceability. Strong flexibility in rescheduling deliveries (both inbound and outbound). Ability to anticipate and quickly resolve problems. Strong integration within the supply chain
  criteria_4_1: No structured communication. No clearly identified contact person. Missing or incorrect information. No transparency. Almost no responsiveness. Delivery dates not updated in the E-Vendor platform
  criteria_4_2: Irregular communication. Contact person hard to reach or frequently changing. Partial transparency. Late or incomplete responses. Delivery dates rarely or never updated in the E-Vendor platform
  criteria_4_3: Generally acceptable communication. Contact person identified but sometimes unavailable. Limited transparency. Responsiveness varies depending on the topic. Delivery dates updated partially or irregularly in the E-Vendor platform
  criteria_4_4: Good communication with a clear and available contact person. Satisfactory transparency. Fast and relevant responses. Delivery dates regularly updated in the E-Vendor platform
  criteria_4_5: Proactive, clear, and smooth communication. Dedicated, responsive, and competent contact person. Total transparency. Exemplary responsiveness with anticipation of needs. Delivery dates always updated and perfectly tracked in the E-Vendor platform
  criteria_5_1: No innovation initiatives. No effort toward collaboration or partnership. Passive attitude, focused only on fulfilling orders
  criteria_5_2: Few improvement or innovation proposals. Weak partnership, mostly one-way communication. Low engagement in joint projects
  criteria_5_3: Occasional suggestions for improvement or innovation. Present as a partner but not fully involved. Collaboration is limited
  criteria_5_4: Good level of interaction. Supplier proposes valuable improvement or innovation ideas. Willing to build a long-term partnership
  criteria_5_5: Strong driver of innovation. Regularly proposes high-value solutions. Fully engaged, reliable, and collaborative partner with a shared vision for growth. High synergy
  criteria_6_1: No technical or field support provided. Extremely slow or no response. Vendor does not assist in resolving issues
  criteria_6_2: Limited and slow support. Rare or ineffective field visits. Low technical competence demonstrated
  criteria_6_3: Support is available but not proactive. Response times are acceptable. Field assistance is provided but could be improved
  criteria_6_4: Reliable technical support with timely responses. Competent field assistance. Clear documentation and helpful guidance
  criteria_6_5: Highly responsive and proactive support. Strong technical expertise. Quick and effective field interventions. Comprehensive and consistent assistance
  criteria_7_1: No commitment to Alvest Ecovadis initiative (VITALS or RATING)
  criteria_7_2: Low RATING score <20% or High VITALS risk
  criteria_7_3: Medium RATING score between 20 and 49% or Medium VITALS risk
  criteria_7_4: High RATING score between 50 and 70% or Low VITALS risk - existing improvement action plan shared with ALVEST, if not rank 3
  criteria_7_5: Best in class score >70% (RATING Questionnaire only)
  criteria_8_1: No anti-corruption policy. Frequent unethical or suspicious practices. Numerous proven cases of corruption
  criteria_8_2: Partial or poorly enforced anti-corruption policy. Some reported or suspected cases. Weak or no controls
  criteria_8_3: Formalized anti-corruption policy generally applied. Few or no incidents
  criteria_8_4: Robust and well-implemented policy. Regular and effective controls. Culture of ethics and integrity encouraged
  criteria_8_5: Exemplary anti-corruption policy fully embedded in company culture. Proactive controls and frequent audits. Strong management commitment. Zero tolerance for corruption
  criteria_9_1: No cybersecurity measures in place. Frequent vulnerabilities and breaches. No protection of critical systems. Sensitive data left unsecured. Risks are ignored
  criteria_9_2: Basic measures exist but with major gaps. Low level of protection. Risks are partially identified but poorly managed. High exposure to attacks.
  criteria_9_3: A cybersecurity policy is in place and generally applied. Critical systems are protected, but some areas remain vulnerable. Limited monitoring. Incident response needs improvement
  criteria_9_4: Strong and well-implemented cybersecurity policy. Effective threat detection. Structured incident response. Known risks are well managed. Compliant with major standards (e.g., ISO 27001, GDPR). Secure practices are part of daily operations
  criteria_9_5: Comprehensive, proactive cybersecurity strategy fully embedded in the company culture. Continuous system monitoring. Risks are anticipated and rigorously managed. Regular audits and continuous improvement. Full compliance with best practices. No major incidents due to effective prevention
