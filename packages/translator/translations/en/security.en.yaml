security:
  forgot: Forgot your password
  forgot-link: Forgot your password ?
  forgot-title: Please enter your email address and we will send you a link to reset your password.
  forgot-success: An email has been sent to you with the information to renew your password, it should arrive shortly (check your spam). If not, please contact IT.
  sso-title: Please enter your email address and validate. You will be redirected to authenticate with your Microsoft account
  sso-link: Connect with Microsoft

  reset_my: I Forgot my Password
  reset_my-title: Confirm your choice, an email with a new password will be sent to you.
  reset_my-success: An email is sent to you with a new password, it should arrive shortly. If not, please contact the webmaster.
  reset_my-error: Your link doesn't appear to be valid.

  reset_other-title: Confirm your choice, an email with a new password will be sent to the user.
  reset_other-success: An email is sent to the user with a new password, it should arrive shortly. If not, please contact the webmaster.

  reset_password:
    title: Choose a new password
    subtitle: Please enter and confirm your new password below.

  fields:
    username: Login
    email: Email
    placeholder: you@example.com
    continue: Continue
  sso_message: SSO is accessible to everyone within ALVEST except CTAS and ALVEST ARABIA EQUIPMENT SERVICES employees yet.

  form:
    legend: Choose a new password
    subtitle: Please enter and confirm your new password below.
    submit:
      label: Reset password
    new_password:
      label: New password
    confirm_password:
      label: Confirm new password
    password_mismatch: The two passwords do not match.
  success: Your password has been updated successfully. You can now log in.
  error: Your link doesn't appear to be valid. Please request a new one.
  weak_password: Your password does not meet the security requirements.

  password_rules:
    title: 'Password must meet the following requirements:'
    min_length: 'At least 15 characters'
    must_contain_letter: 'At least one letter'
    two_of_three: 'At least 2 of the following 3 criteria:'
    uppercase_and_lowercase: 'Both uppercase and lowercase letters'
    number: 'At least one number'
    special_char: 'At least one special character (_ @ $ # & % ! .)'
    no_spaces: 'Must not start or end with a space'
    no_name: 'Must not contain 3 consecutive letters from your first or last name'
    no_previous: 'Must be different from your last 3 passwords'