      add_main_file: Click here to add a Main File
      add_files: You can add files to the TOC with the Drop Zone on this page
      create_contact: Create a new Contact
      assignee: Start typing on your name to change the assignee
      technician: Start typing on your name to change the technician
      factory_flag_recently_closed: "Open TOCs (assigned to you) with a factory flag response within the last 4 days"
      customer: By default, the customer name is END USER of the ER, you can change it in case it is the Maintainer that is calling you to report the claim for example
      latest: TOCs sorted by the most recent on top
      late: |
        TOC's sorted by the oldest TOC log. Click on the icon to see more than 5 TOC's.
        This is considering all LOGS : internal and external, sorted by the oldest log update.
      translation: You are seeing automatically translated text. Click here to see the original text.
      status_definitions: |
        PENDING = Your service ticket has been successfully created, and a technician will be assigned shortly to begin the investigation.
        IN PROGRESS = Your service ticket is currently being investigated by our technical team. Diagnostic and resolution activities are underway.
        SUSPENDED = Your service ticket is temporarily on hold pending additional actions or information. This status may apply when access to the equipment is unavailable or when a solution has been implemented and requires a monitoring period before further action.
        SOLVED = A solution has been identified and implemented. The reported issue has been resolved.
        CLOSED = After the problem is SOLVED, the solution has been reviewed and validated by our Service team. The ticket is formally closed.
      serialNumber: |
        IMPORTANT to KNOW :
        1) if you enter the T number in "Serial number" field and you record an ASSET NUMBER on the "Customer Asset Number" field, this information will be updated in ER MODULE automatically
        2) if you create a TOC with no "Serial number" (SN is left empty) you MUST record an ASSET NUMBER in "Customer Asset Number" field to give an identifier to the equipment
      length: To secure a good translation, do not use abbreviation and your description must be minimum 12 characters
