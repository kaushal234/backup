        Importance Factor (IF) meaning

        IF=1: Administrative action, parts request, simple technical question
        IF=10: Regular operations, technical troubleshooting, requires TLD technician
        IF=100: Severe technical issues requiring Customer Service Manager (CSM) and/or Sales and Service Director (SSD) attention or factory support
