      y: Percent
    tat:
      title: TOC Average Time (TAT) evolution
      subtitle: |
        Measure Service department efficiency through the average time to SOLVE TOC (value in DAYS) <br/>
        For a specific month, SUM the time in days of all SOLVED TOC during that month DIVIDED by the Number of TOC solved of that same month
      y: Days
    oldest:
      title: TOC Oldest (TOL)
      subtitle: |
        Alerts about the oldest customer support issue not solved yet (value in DAYS) <br/>
        Get the list of TOC NOT SOLVED before the specified month AND take the bigger number of days opened until the end of this specified month
      y: Days
