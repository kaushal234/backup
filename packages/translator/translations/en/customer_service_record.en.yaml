      is_link_working : Sending data to LINK FMS ?
    tooltips:
      aspect: >
        0: Not good at all - the unit is not compliant, with defects blocking the usage (wrong customer logo, wrong paint color). Unit must return to the factory.
        1: Not good - the unit is not compliant, with defects on critical components or broken accessories affecting safety. Can be fixed later locally.
        2: Not good - the unit is not compliant, with defects such as visible rust, scratches, or missing/incorrect safety markings that may endanger the user. Can be fixed locally.
        3: Unit is operational - compliant but with defects like scratches, broken accessories affecting aesthetics, or missing TLD Service sticker. Fixed the same day.
        4: Unit is operational - fully compliant with minor defects only (small scratches, no broken accessories). Fixed the same day.
        5: 100% correct - the unit looks great.
      conformity: >
        0: Not good or non-compliant at all - the unit is in such a bad shape that it cannot operate (wrong engine, missing component). Must return to the factory.
        1: Not good or non-compliant - critical components are not operating and may endanger the user. Needs fixing later, locally.
        2: Not good or non-compliant - critical components are not operating but with no immediate danger. Fixed locally.
        3: Unit is operational - works but key options are missing or its mission may not be completed. Fixed locally.
        4: Unit is operational - works with minor defects and can usually complete its mission. Fixed the same day.
        5: 100% correct - the unit is in top-notch condition.
      operational: >
        0: Not good or non-compliant at all - the unit is not operational and must be brought back to the factory.
        1: Not good or non-compliant - the unit is not operational and requires major fixes before starting (transmission, engine, software, etc.). New commissioning date required, fixed locally.
        2: Not good or non-compliant - the unit is operational but needs fixes before starting or cannot perform all missions (transmission, engine, software, etc.). Fixes done locally.
        3: Unit is operational - works but required fixes before start (fuses, oil level, bulbs, etc.) or still cannot perform all missions. Fixes done on commissioning day.
        4: Unit is operational - starts after minor checks only.
        5: 100% correct - the unit starts on the first try and can accomplish all missions.
    success:
      add: Intervention has been successfully created.
      update: Intervention has been successfully updated.
      delete: Intervention has been successfully deleted.
      toc: "TOC #%toc% has been successfully updated."
