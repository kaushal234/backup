spq:
  common:
    dear: Dear
    regards: Sincerely,
    signature: TLD Spare Parts Team
    signature_aero: AERO Specialties Sales Team
    signature_lebrun: Lebrun Team
    subject_status_changed: Quotation's status changed to %status%
    subject_summary_pending_suspended: "'PENDING' and 'SUSPENDED' quotations > 48h"
    subject_ssummary_submittedfull_submittedfpartial: "'SUBMITTED FULL' and 'SUBMITTED PARTIAL' quotations of the week"
    spare_parts_contact: "Spare parts Contact:"

  new_quotation:
    subject: New Quotation
    message: |
      Following-up on your request to %company% Spare Parts Department on %createdAt%, we inform you that your Request for Quote %rfq% is addressed by %firstnamePoster% %lastnamePoster% under reference SPQ#%id%.
      Please keep this reference handy as it will facilitate any further exchanges we may have.

      In the meantime, whilst we work on the quotation, your sales representative %firstnamePoster% %lastnamePoster% and our %company% Spare Parts Team are always available for any other questions or inquiries you may have.

  suspended_quotation:
    message: |
          Following-up on your request for Quote %rfq% (SPQ#%id%) on %receivedAt%, we currently have this quote on hold for the following reason(s) :

          %comment%

          Feel free to call %firstnamePoster% %lastnamePoster% at %tldContactPhones% (or email: %emailPoster%) if you have any question.

  submitted_full_quotation:
    message: |
          Your Request for Quote %rfq% has now been released : see attached Quote number SPQ#%id%.

          %comment%

          Should you have any queries regarding the above mentioned quotation, please contact us at your earliest convenience.

          We do thank you for trusting %company% in your operation.

  submitted_partial_quotation:
    message: |
          Your Request for Quote %rfq% has been released : see attached Quote number %id%. Note that quotation is only partial as some references could not be quoted for the following reason(s):

          %comment%

          Contact %firstnameQuoter% %lastnameQuoter% at %tldContactPhones% (or email: %emailQuoter%) if you have any question about this quote status.

  ordered_quotation:
    message: |
          Your order %custPoNumber% has been recorded under Sale Order Acknowledgement number SO#%so%.

          If any question you can contact %firstnameQuoter% %lastnameQuoter% at %tldContactPhones% (or email: %emailQuoter%).

  lost_or_cancelled_quotation:
    message: |
          SPQ %status% by %firstnameQuoter% %lastnameQuoter%

          Reason:

  pending_or_suspended_quotation_summary:
    message: "Quotations with status 'PENDING' or 'SUSPENDED' since more than 2 days"
    header:
      customer_name: Customer name
      spq: SPQ#
      open_date: Open Date
      suspend_date: Suspend Date
      days_late: Nb days late

  partial_and_full_quotation_summary:
    message: "Quotations with status 'SUBMITTED PARTIAL' or 'SUBMITTED FULL' of the week"
    header:
      location: Location Sales Rep
      sales_rep: Sales rep
      status: Status
      customer_name: Customer name
      spq: SPQ#
      open_date: Opened date
      quote_value: Quote value
      currency: 'Currency'

  references:
    spq_number: SPQ (Spare Parts Quote) Number
    customer_name: Customer Name
    customer_contact_name: Customer Contact Name
    customer_contact_email: Customer Contact Email
    rfq_number: Your RFQ number

